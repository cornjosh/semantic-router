{{- $cfg := include "adaptive.config" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adaptive.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  service.yaml: |
{{ $cfg | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adaptive.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adaptive.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    {{- if eq .Values.storage.backend "sqlite" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
      annotations:
        checksum/config: {{ $cfg | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- if gt (int .Values.replicas) 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
      {{- end }}
      containers:
        - name: classifier
          image: {{ required "provide image for the built classifier" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/semantic-router/service.yaml"]
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: {{ .Values.credentialsSecret }}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ .Values.resources | toJson }}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, timeoutSeconds: 3, failureThreshold: 1}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          volumeMounts:
            - {name: config, mountPath: /etc/semantic-router, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if eq .Values.storage.backend "sqlite" }}
            - {name: data, mountPath: /data}
            {{- else }}
            - {name: etcd-tls, mountPath: /etcd-tls, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "adaptive.name" . }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if eq .Values.storage.backend "sqlite" }}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "adaptive.name" . }}-data}
        {{- else }}
        - name: etcd-tls
          secret: {secretName: {{ .Values.storage.clientTLSSecret }}, defaultMode: 0440}
        {{- end }}
{{- if eq .Values.storage.backend "sqlite" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "adaptive.name" . }}-data
  namespace: {{ .Release.Namespace }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.storage.storageClassName nil }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.storage.size }}}}
{{- else }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "adaptive.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
{{- end }}
