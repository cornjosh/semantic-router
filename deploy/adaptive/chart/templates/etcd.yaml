{{- if .Values.etcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adaptive.etcd" . }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
  ports: [{name: client, port: 2379}, {name: peer, port: 2380}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "adaptive.etcd" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 3
  podManagementPolicy: Parallel
  serviceName: {{ include "adaptive.etcd" . }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
      containers:
        - name: etcd
          image: {{ .Values.etcd.image | quote }}
          command: [/usr/local/bin/etcd]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=https://0.0.0.0:2379
            - --listen-peer-urls=https://0.0.0.0:2380
            - --advertise-client-urls=https://$(POD_NAME).{{ include "adaptive.etcd" . }}.{{ .Release.Namespace }}.svc.cluster.local:2379
            - --initial-advertise-peer-urls=https://$(POD_NAME).{{ include "adaptive.etcd" . }}.{{ .Release.Namespace }}.svc.cluster.local:2380
            - --initial-cluster={{ range $i := until 3 }}{{ if $i }},{{ end }}{{ include "adaptive.etcd" $ }}-{{ $i }}=https://{{ include "adaptive.etcd" $ }}-{{ $i }}.{{ include "adaptive.etcd" $ }}.{{ $.Release.Namespace }}.svc.cluster.local:2380{{ end }}
            - --initial-cluster-token={{ .Release.Name }}-adaptive-state
            - --initial-cluster-state=new
            - --cert-file=/tls/tls.crt
            - --key-file=/tls/tls.key
            - --trusted-ca-file=/tls/ca.crt
            - --client-cert-auth=true
            - --peer-cert-file=/tls/tls.crt
            - --peer-key-file=/tls/tls.key
            - --peer-trusted-ca-file=/tls/ca.crt
            - --peer-client-cert-auth=true
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=1073741824
          ports: [{name: client, containerPort: 2379}, {name: peer, containerPort: 2380}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe:
            exec:
              command: [/usr/local/bin/etcdctl, --endpoints=https://127.0.0.1:2379, --cacert=/tls/ca.crt, --cert=/tls/tls.crt, --key=/tls/tls.key, endpoint, health]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: {{ required "provide etcd.serverTLSSecret" .Values.etcd.serverTLSSecret }}, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.storage.storageClassName nil }}
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.etcd.size }}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "adaptive.etcd" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adaptive.etcd" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "adaptive.name" . }}}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
      ports: [{protocol: TCP, port: 2379}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "adaptive.etcd" . }}}
      ports: [{protocol: TCP, port: 2380}]
{{- end }}
